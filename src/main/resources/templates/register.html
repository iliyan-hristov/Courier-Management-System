<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeliveryApp | Register</title>
    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>
<body>

<div class="register-container">
    <div class="register-card">
        <h2>Create Account</h2>
        <p>Join DeliveryApp today</p>

        <form th:action="@{/register}" method="post" th:object="${registerRequest}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" placeholder="Your name" id="username" th:field="*{username}">
                <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="error"></div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}" placeholder="Your email" required>
                <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error"></div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" th:field="*{password}" placeholder="Create password" required>
                <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error"></div>
            </div>

            <button type="submit" class="register-btn">Sign Up</button>

            <div th:if="${param.success}" class="success">
                Registration successful! Please log in.
            </div>
            <div th:if="${param.error}" class="error">
                There was an error with your registration. Please try again.
            </div>
        </form>

        <div class="footer">
            <a th:href="@{/}">Already have an account? Login</a>
        </div>
    </div>
</div>

</body>
</html>

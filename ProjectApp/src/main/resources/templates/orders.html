<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="stylesheet" th:href="@{/css/orders.css}">
</head>
<body>

<div class="login-container">
    <div class="login-card">
        <h2>My Orders</h2>
        <p th:text="'Welcome, ' + ${username} + '!'"></p>

        <div th:if="${#lists.isEmpty(shipments)}" class="empty-orders">
            <p>You don't have any shipments yet.</p>
        </div>

        <div th:if="${!#lists.isEmpty(shipments)}">
            <div th:each="s : ${shipments}" style="border: 1px solid #ddd; margin: 10px 0; padding: 15px; border-radius: 8px;">
                <p><strong>Tracking #:</strong> <span th:text="${s.trackingNumber}"></span></p>
                <p><strong>Status:</strong> <span th:text="${s.status}"></span></p>
                <p><strong>Receiver:</strong> <span th:text="${s.receiverName}"></span></p>
                <p><strong>Destination:</strong> <span th:text="${s.destinationAddress}"></span></p>
                <p><strong>Created:</strong> <span th:text="${#temporals.format(s.createdAt, 'dd MMM yyyy')}"></span></p>
                <p><strong>Courier Type:</strong> <span th:text="${s.courierType}"></span></p>

                <form th:action="@{'/orders/delete/' + ${s.id}}" method="post" style="display: inline;">
                    <button type="submit" class="delete-btn"
                            onclick="return confirm('Are you sure you want to delete this order?')">
                        Delete
                    </button>
                </form>

                <form th:if="${s.rating == null}" th:action="@{'/orders/rate/' + ${s.id}}" method="get" style="display: inline;">
                    <button type="submit" class="rate-btn">Rate</button>
                </form>


            </div>
        </div>

        <div class="footer">
            <a href="/login">Back</a>
        </div>
    </div>
</div>

</body>
</html>

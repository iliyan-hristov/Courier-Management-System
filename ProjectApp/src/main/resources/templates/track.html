<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Shipment</title>
    <link rel="stylesheet" th:href="@{/css/track.css}">

</head>
<body>

<div class="login-container">
    <div class="login-card">
        <h2>Shipment Status</h2>

        <form th:action="@{/track}" method="post">
            <div class="form-group">
                <label for="trackingNumber">Tracking number</label>
                <input type="text" id="trackingNumber" name="trackingNumber" placeholder="e.g. TRK123456789" required>
            </div>
            <button type="submit" class="login-btn">Track Shipment</button>
        </form>

        <div th:if="${shipment}" class="logout-msg" style="margin-top:20px;">
            <p><strong>Tracking Number:</strong> <span th:text="${shipment.trackingNumber}"></span></p>
            <p><strong>Status:</strong> <span th:text="${shipment.status}"></span></p>
            <p><strong>Receiver:</strong> <span th:text="${shipment.receiverName}"></span></p>
            <p><strong>Destination:</strong> <span th:text="${shipment.destinationAddress}"></span></p>


        </div>

        <div th:if="${error}" class="error" th:text="${error}" style="margin-top:20px;"></div>

        <div class="footer">
            <a href="/login">Back</a>
        </div>
    </div>
</div>

</body>
</html>

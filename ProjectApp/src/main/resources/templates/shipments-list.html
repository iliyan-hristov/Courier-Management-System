<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Panel</title>
    <link rel="stylesheet" th:href="@{/css/shipments-list.css}">
    <link rel="stylesheet" th:href="@{/css/orders.css}">
</head>
<body>

<div class="container">
    <h1>Shipments List</h1>

    <form method="get" action="/admin/shipments-list" class="filter-box">
        <label><strong>Sort by:</strong></label>
        <select name="sortBy">
            <option value="customer" th:selected="${sortBy == 'customer'}">Customer</option>
            <option value="courier" th:selected="${sortBy == 'courier'}">Courier</option>
            <option value="total" th:selected="${sortBy == 'total'}">Total Price</option>
        </select>

        <button type="submit">Sort</button>
    </form>

    <table>
        <thead>
        <tr>
            <th>Tracking Number</th>
            <th>Customer</th>
            <th>Receiver</th>
            <th>Courier</th>
            <th>Status</th>
            <th>Total Price</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="order : ${orders}">
            <td th:text="${order.trackingNumber}"></td>
            <td th:text="${order.customer}"></td>
            <td th:text="${order.receiverName}"></td>
            <td th:text="${order.courier}"></td>
            <td th:text="${order.status}"></td>
            <td th:text="${order.total}"></td>
            <td>
                <form th:if="${order.status == 'Pending'}"
                      th:action="@{'/admin/orders/' + ${order.id} + '/accept'}"
                      method="post" style="display: inline;">
                    <button type="submit" class="accept-btn">Accept</button>
                </form>
                <form th:action="@{'/admin/orders/' + ${order.id} + '/delete'}"
                      method="post" style="display: inline;">
                    <button type="submit" class="delete-btn"
                            onclick="return confirm('Are you sure you want to delete this order?')">Delete</button>
                </form>
                <span th:if="${order.status != 'Pending' && order.status != 'Accepted'}" th:text="${order.status}"></span>
            </td>
        </tr>
        </tbody>

    </table>

    </table>

    <div style="display: flex; justify-content: space-between; align-items: center; margin: 20px 0;">
        <a href="/admin" class="back-btn">⬅ Back to Admin</a>
        <a href="http://localhost:8081/api/statistics/page" target="_blank" class="stats-btn">
            🌐 View Statistics
        </a>
    </div>


</div>

</body>
</html>

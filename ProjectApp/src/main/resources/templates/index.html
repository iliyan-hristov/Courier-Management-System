<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeliveryApp | Login</title>
    <link rel="stylesheet" th:href="@{/css/index.css}">

</head>
<body>

<div class="login-container">
    <div class="login-card">
        <h2>Delivery App</h2>
        <p>Please sign in to your account</p>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>

        <div th:if="${errorMessage}" class="error" th:text="${errorMessage}"></div>
        <div th:if="${logoutMessage}" class="logout-msg" th:text="${logoutMessage}"></div>
        <div th:if="${successMessage}" class="success" th:text="${successMessage}"></div>


        <div class="footer">
            <a th:href="@{/register}">Don’t have an account? Sign up</a>
        </div>
    </div>
</div>

</body>
</html>
